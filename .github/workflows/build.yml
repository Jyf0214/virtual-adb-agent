name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 检查 Kotlin 语法
        run: |
          echo "▸ 检查 Kotlin 文件括号匹配..."
          errors=0
          for f in $(find . -name "*.kt" -o -name "*.kts" | grep -v node_modules | grep -v build); do
            open=$(grep -o '{' "$f" | wc -l)
            close=$(grep -o '}' "$f" | wc -l)
            if [ "$open" -ne "$close" ]; then
              echo "  ✗ $f: 花括号不匹配 { = $open, } = $close"
              errors=$((errors + 1))
            fi
            open_p=$(grep -o '(' "$f" | wc -l)
            close_p=$(grep -o ')' "$f" | wc -l)
            if [ "$open_p" -ne "$close_p" ]; then
              echo "  ✗ $f: 圆括号不匹配 ( = $open_p, ) = $close_p"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "═══ Kotlin 语法检查失败 ═══"
            exit 1
          fi
          echo "  ✓ Kotlin 语法检查通过"

      - name: 检查 XML 格式
        run: |
          echo "▸ 检查 XML 文件..."
          for f in $(find . -name "*.xml" | grep -v node_modules | grep -v build); do
            if command -v xmllint &>/dev/null; then
              if ! xmllint --noout "$f" 2>/dev/null; then
                echo "  ✗ $f: XML 格式错误"
                exit 1
              fi
            fi
          done
          echo "  ✓ XML 格式检查通过"

      - name: 检查敏感信息
        run: |
          echo "▸ 检查敏感信息..."
          patterns='password\s*=\s*"[^"]+"|api[_-]?key\s*=\s*"[^"]+"|secret\s*=\s*"[^"]+"|PRIVATE KEY'
          found=0
          for f in $(find . -name "*.kt" -o -name "*.xml" -o -name "*.kts" | grep -v node_modules | grep -v build); do
            if grep -qiE "$patterns" "$f" 2>/dev/null; then
              echo "  ✗ $f: 疑似包含敏感信息"
              found=$((found + 1))
            fi
          done
          if [ "$found" -gt 0 ]; then
            echo "═══ 敏感信息检查失败 ═══"
            exit 1
          fi
          echo "  ✓ 未发现敏感信息"

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 缓存 debug keystore
        uses: actions/cache@v4
        id: keystore-cache
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-${{ github.run_id }}
          restore-keys: |
            debug-keystore-

      - name: 确保 debug keystore 存在
        run: |
          mkdir -p ~/.android
          if [ -f ~/.android/debug.keystore ]; then
            echo "▸ 使用已有的 debug keystore（签名一致）"
          else
            echo "▸ 生成新的 debug keystore..."
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey 2>&1 | head -5

      - name: 生成 Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 Debug APK（保留 1 天）
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: virtual-adb-agent-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
