name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装检查工具
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint && sudo mv ktlint /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          echo "▸ ktlint $(ktlint --version), xmllint $(xmllint --version 2>&1 | head -1)"

      - name: Kotlin 语法检查（ktlint）
        run: ktlint --relative "**/*.kt" "**/*.kts"

      - name: XML 格式检查（xmllint）
        run: |
          errors=0
          for f in $(find . -name "*.xml" -not -path "*/build/*" -not -path "*/.git/*"); do
            if ! xmllint --noout "$f" 2>/dev/null; then
              echo "✗ $f"
              errors=$((errors + 1))
            fi
          done
          [ "$errors" -eq 0 ] || exit 1

      - name: 敏感信息检查
        run: |
          patterns='password\s*=\s*"[^"]+"|api[_-]?key\s*=\s*"[^"]+"|secret\s*=\s*"[^"]+"|PRIVATE KEY'
          found=0
          for f in $(find . -name "*.kt" -o -name "*.xml" -o -name "*.kts" | grep -v build | grep -v .git); do
            if grep -qiE "$patterns" "$f" 2>/dev/null; then
              echo "✗ $f: 疑似包含敏感信息"
              found=$((found + 1))
            fi
          done
          [ "$found" -eq 0 ] || exit 1

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 计算构建文件哈希
        id: build-hash
        run: |
          HASH=$(cat app/build.gradle.kts build.gradle.kts settings.gradle.kts gradle.properties gradle/libs.versions.toml 2>/dev/null | sha256sum | cut -d' ' -f1)
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "▸ 构建文件哈希: $HASH"

      - name: 缓存 debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-${{ steps.build-hash.outputs.hash }}

      - name: 确保 debug keystore 存在
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "▸ keystore 就绪: $(ls -la ~/.android/debug.keystore)"

      - name: 生成 Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 Debug APK（保留 1 天）
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: virtual-adb-agent-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
