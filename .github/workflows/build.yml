name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装检查工具
        run: |
          curl -sSLO https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint && sudo mv ktlint /usr/local/bin/
          sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils
          echo "▸ ktlint $(ktlint --version), xmllint $(xmllint --version 2>&1 | head -1)"

      - name: Kotlin 语法检查（ktlint）
        run: ktlint --relative "**/*.kt" "**/*.kts"

      - name: XML 格式检查（xmllint）
        run: |
          errors=0
          for f in $(find . -name "*.xml" -not -path "*/build/*" -not -path "*/.git/*"); do
            if ! xmllint --noout "$f" 2>/dev/null; then
              echo "✗ $f"
              errors=$((errors + 1))
            fi
          done
          [ "$errors" -eq 0 ] || exit 1

      - name: 敏感信息检查
        run: |
          patterns='password\s*=\s*"[^"]+"|api[_-]?key\s*=\s*"[^"]+"|secret\s*=\s*"[^"]+"|PRIVATE KEY'
          found=0
          for f in $(find . -name "*.kt" -o -name "*.xml" -o -name "*.kts" | grep -v build | grep -v .git); do
            if grep -qiE "$patterns" "$f" 2>/dev/null; then
              echo "✗ $f: 疑似包含敏感信息"
              found=$((found + 1))
            fi
          done
          [ "$found" -eq 0 ] || exit 1

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: 生成 Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      - name: 构建 Debug APK
        run: ./gradlew assembleDebug --no-daemon

      # 签名密钥由独立的 actions/cache 管理，不走 Gradle 缓存
      - name: 缓存调试签名密钥
        id: cache-key
        uses: actions/cache@v4
        with:
          path: ~/debug_signing_key.keystore
          key: debug-signing-key-v1

      - name: 注入调试签名
        shell: bash
        run: |
          KS_PATH=~/debug_signing_key.keystore
          KSPASS=androiddebug
          KSALIAS=debug

          if [ -f "$KS_PATH" ]; then
            echo "✓ 复用缓存签名"
          else
            echo "○ 首次运行，生成新签名密钥..."
            keytool -genkeypair -v \
              -keystore "$KS_PATH" \
              -alias "$KSALIAS" \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KSPASS" -keypass "$KSPASS" \
              -dname "CN=debug,O=debug,C=XX" -noprompt
            echo "✓ 新签名已生成"
          fi

          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          [ -z "$APK" ] && { echo "⚠ 未找到 APK"; exit 1; }

          # 移除旧签名（忽略 zip 的警告退出码）
          zip -q -d "$APK" "META-INF/*" || :

          # 找 apksigner
          unset APKSIGNER
          for dir in "$ANDROID_HOME/build-tools" /usr/local/lib/android/sdk/build-tools /opt/android/sdk/build-tools; do
            [ -d "$dir" ] || continue
            found=$(find "$dir" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
            [ -n "$found" ] && { APKSIGNER=$found; break; }
          done

          if [ -z "${APKSIGNER:-}" ]; then
            echo "⚠ 未找到 apksigner，跳过签名"
            exit 0
          fi

          "$APKSIGNER" sign \
            --ks "$KS_PATH" \
            --ks-pass "pass:$KSPASS" \
            --ks-key-alias "$KSALIAS" \
            --key-pass "pass:$KSPASS" \
            "$APK"
          echo "✓ 签名完成"

      - name: 上传 Debug APK（保留 1 天）
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: virtual-adb-agent-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 1
